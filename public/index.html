<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realtime Chat</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth"><div class="box"><h1>Realtime Chat</h1><div><button id="lt">ログイン</button><button id="rt">新規登録</button></div><form id="af"><input id="u" placeholder="ID" required><input id="dn" placeholder="表示名（新規登録）"><input id="p" type="password" placeholder="パスワード" required><button id="ab">ログイン</button></form><p id="ae"></p></div></div>
<div id="app" class="hide"><header><b>Realtime Chat</b><span id="on">オンライン:0</span><span><img id="ava" class="av sm"><b id="mn"></b><button id="pb">プロフィール</button><button id="lo">ログアウト</button></span></header><main id="msgs"></main><div id="ty"></div><div id="rb" class="hide"></div><form id="sf"><input id="mi" placeholder="メッセージを入力"><button>送信</button></form></div>
<div id="pm" class="modal hide"><div class="box"><h2>プロフィール</h2><img id="pv" class="av lg"><input id="file" type="file" accept="image/*"><input id="pname" placeholder="表示名"><button id="save">保存</button><button id="close">閉じる</button><p id="pe"></p></div></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
