<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Realtime Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Realtime Chat</h1>
        <div id="online">オンライン: 0</div>
      </div>
      <span id="status">接続中...</span>
    </header>

    <section id="login" class="card">
      <h2>チャットに参加</h2>
      <input id="name" maxlength="30" placeholder="名前を入力">
      <button id="join">参加する</button>
    </section>

    <section id="chat" class="hidden">
      <div id="messages" class="messages"></div>
      <div id="typing"></div>
      <form id="form">
        <input id="input" maxlength="1000" autocomplete="off" placeholder="メッセージを入力">
        <button>送信</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
